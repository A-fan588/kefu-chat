<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客服管理后台</title>
    <link rel="stylesheet" href="responsive.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            height: 100vh;
            background: #f0f2f5;
        }
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .auth-box {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .auth-box h2 { margin-bottom: 24px; text-align: center; }
        .auth-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .auth-box button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .auth-box .toggle {
            text-align: center;
            margin-top: 16px;
            color: #667eea;
            cursor: pointer;
        }
        .admin-container {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 280px;
            background: #fff;
            border-right: 1px solid #eee;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sidebar-header img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
        }
        .sidebar-header .info { flex: 1; }
        .sidebar-header .name { font-weight: 600; }
        .sidebar-header .status { font-size: 12px; color: #52c41a; }
        .sidebar-header .logout {
            color: #ff4d4f;
            cursor: pointer;
            font-size: 14px;
        }
        .search-box {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        .search-box input {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid #eee;
            border-radius: 20px;
            outline: none;
        }
        .customer-list {
            flex: 1;
            overflow-y: auto;
        }
        .customer-item {
            padding: 16px;
            display: flex;
            gap: 12px;
            cursor: pointer;
            border-bottom: 1px solid #f5f5f5;
        }
        .customer-item:hover, .customer-item.active {
            background: #f0f7ff;
        }
        .customer-item img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
        }
        .customer-item .info { flex: 1; min-width: 0; }
        .customer-item .name {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .customer-item .unread-badge {
            background: #ff4d4f;
            color: #fff;
            font-size: 12px;
            padding: 1px 6px;
            border-radius: 10px;
            font-weight: 600;
            min-width: 18px;
            text-align: center;
        }
        .customer-item .online-dot {
            width: 8px;
            height: 8px;
            background: #52c41a;
            border-radius: 50%;
        }
        .admin-btn {
            width: calc(100% - 16px);
            margin: 8px;
            padding: 10px;
            background: linear-gradient(135deg, #ffd700 0%, #ffb700 100%);
            color: #8b4513;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .admin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 183, 0, 0.4);
        }
        .customer-item .online-dot.offline { background: #d9d9d9; }
        .customer-item .preview {
            font-size: 13px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .customer-item .time {
            font-size: 12px;
            color: #999;
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            padding: 16px 24px;
            background: #fff;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chat-header .customer-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-header img { width: 44px; height: 44px; border-radius: 50%; }
        .chat-header .region { font-size: 12px; color: #666; }
        .search-chat-btn {
            background: #f0f7ff;
            color: #667eea;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .search-chat-btn:hover {
            background: #667eea;
            color: #fff;
        }
        .chat-search-box {
            background: #fff;
            padding: 12px 24px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chat-search-box .nav-btn {
            background: #f0f0f0;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: #666;
            transition: all 0.2s;
        }
        .chat-search-box .nav-btn:hover {
            background: #667eea;
            color: #fff;
        }
        .chat-search-box input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
        }
        .chat-search-box input:focus {
            border-color: #667eea;
        }
        .chat-search-box button:not(.nav-btn) {
            background: #f0f0f0;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
        }
        .chat-search-box button:not(.nav-btn):hover {
            background: #e0e0e0;
        }
        .search-result-info {
            font-size: 12px;
            color: #666;
            margin-left: 8px;
            white-space: nowrap;
        }
        .highlight {
            background: #ffeb3b;
            padding: 0 4px;
            border-radius: 3px;
        }
        .match-highlight {
            animation: pulse-highlight 0.5s ease-in-out;
            background: rgba(7, 193, 96, 0.1);
            border-radius: 8px;
        }
        @keyframes pulse-highlight {
            0%, 100% {
                box-shadow: none;
            }
            50% {
                box-shadow: 0 0 0 4px rgba(7, 193, 96, 0.3);
            }
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #e8e8e8;
        }
        .message {
            margin-bottom: 18px;
            display: flex;
            align-items: flex-start;
        }
        .message.agent {
            justify-content: flex-end;
        }
        .message:not(.agent) {
            justify-content: flex-start;
        }
        .message img.avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            flex-shrink: 0;
            background: #ccc;
        }
        .message.agent img.avatar {
            margin-left: 10px;
        }
        .message:not(.agent) img.avatar {
            margin-right: 10px;
        }
        .message .msg-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 65%;
        }
        .message .bubble {
            padding: 10px 14px;
            background: #fff;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
            position: relative;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .message:not(.agent) .bubble {
            border-radius: 0 10px 10px 10px;
        }
        .message.agent .bubble {
            background: #07c160;
            color: #fff;
            border-radius: 10px 0 10px 10px;
        }
        .message:not(.agent) .bubble::before {
            content: '';
            position: absolute;
            left: -6px;
            top: 0;
            width: 0;
            height: 0;
            border-top: 0 solid transparent;
            border-bottom: 10px solid transparent;
            border-right: 10px solid #fff;
        }
        .message.agent .bubble::before {
            content: '';
            position: absolute;
            right: -6px;
            top: 0;
            width: 0;
            height: 0;
            border-top: 0 solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 10px solid #07c160;
        }
        .message .media-image {
            max-width: 100%;
            max-height: 280px;
            border-radius: 6px;
            cursor: pointer;
            display: block;
            margin-top: 4px;
        }
        .message .media-video {
            max-width: 100%;
            max-height: 280px;
            border-radius: 6px;
            display: block;
            margin-top: 4px;
        }
        .message .file-link {
            margin-top: 6px;
        }
        .message:not(.agent) .file-link a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #576b95;
            text-decoration: none;
            padding: 6px 10px;
            background: #f5f7fa;
            border-radius: 4px;
            font-size: 14px;
        }
        .message.agent .file-link a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #fff;
            text-decoration: none;
            padding: 6px 10px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            font-size: 14px;
        }
        .message .time {
            font-size: 11px;
            color: #999;
            margin-top: 2px;
            padding: 0 6px;
        }
        .message.agent .time {
            text-align: right;
        }
        .typing-indicator {
            padding: 12px 16px;
            background: #fff;
            border-radius: 16px;
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }
        .chat-input-area {
            background: #fff;
            border-top: 1px solid #eee;
            padding: 16px 24px;
        }
        .quick-replies {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .quick-reply {
            padding: 6px 14px;
            background: #f0f7ff;
            border: 1px solid #d6e4ff;
            border-radius: 16px;
            font-size: 13px;
            cursor: pointer;
        }
        .quick-reply:hover { background: #d6e4ff; }
        .chat-input {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        .chat-input textarea {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 12px 16px;
            resize: none;
            font-size: 14px;
            outline: none;
            max-height: 150px;
        }
        .chat-input textarea:focus { border-color: #667eea; }
        .chat-input button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            cursor: pointer;
        }
        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }
        .toolbar button {
            background: #f5f5f5;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .toolbar button:hover { background: #eee; }
        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid #eee;
        }
        .sidebar-footer button {
            width: 100%;
            padding: 10px;
            background: #f5f5f5;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .mobile-menu-btn {
            display: none;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal {
            background: #fff;
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal h3 { margin-bottom: 16px; }
        .modal input, .modal textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
        }
        .modal-buttons .cancel {
            background: #f5f5f5;
            border: none;
        }
        .modal-buttons .confirm {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
        }
        .search-results {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #fff;
            width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            z-index: 1001;
        }
        .search-results-header {
            padding: 16px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .search-results-header .close {
            cursor: pointer;
            font-size: 20px;
        }
        .search-result-item {
            padding: 16px;
            border-bottom: 1px solid #f5f5f5;
            cursor: pointer;
        }
        .search-result-item:hover { background: #f5f5f5; }
        .no-customer {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #999;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="authView" class="auth-container">
        <div class="auth-box">
            <h2 id="authTitle">登录</h2>
            <input type="text" id="username" placeholder="用户名">
            <input type="password" id="password" placeholder="密码">
            <input type="text" id="nickname" placeholder="昵称" style="display:none;">
            <button onclick="handleAuth()" id="authBtn">登录</button>
            <div class="toggle" onclick="toggleAuth()">没有账号？点击注册</div>
        </div>
    </div>

    <div id="adminView" class="admin-container" style="display:none;">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img id="myAvatar" src="">
                <div class="info">
                    <div class="name" id="myName"></div>
                    <div class="status">● 在线</div>
                </div>
                <div class="logout" onclick="logout()">退出</div>
            </div>
            <div id="adminPanel" style="display:none;">
                <button class="admin-btn" onclick="openAdminModal()">👑 客服管理</button>
            </div>
            <div class="search-box">
                <input type="text" id="globalSearch" placeholder="搜索消息..." onkeypress="handleSearch(event)">
            </div>
            <div class="customer-list" id="customerList"></div>
            <div class="sidebar-footer">
                <button onclick="openQuickRepliesModal()">快捷回复管理</button>
            </div>
        </div>
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
        <div class="chat-area" id="chatArea">
            <div class="mobile-menu-btn" onclick="toggleSidebar()">☰</div>
            <div class="no-customer">选择一个客户开始聊天</div>
        </div>
    </div>

    <div id="quickRepliesModal" class="modal-overlay" style="display:none;">
        <div class="modal">
            <h3>快捷回复</h3>
            <div id="quickRepliesList"></div>
            <div style="margin-top:16px;">
                <input type="text" id="newReplyTitle" placeholder="标题">
                <textarea id="newReplyContent" placeholder="回复内容" rows="3"></textarea>
                <div style="margin-top:8px;">
                    <button onclick="document.getElementById('quickReplyPhotoInput').click()">📷 添加图片</button>
                    <button onclick="document.getElementById('quickReplyFileInput').click()">📎 添加文件</button>
                    <input type="file" id="quickReplyPhotoInput" accept="image/*" style="display:none;" onchange="handleQuickReplyFileUpload(event, 'image')">
                    <input type="file" id="quickReplyFileInput" accept="video/*,.pdf,.doc,.docx,.xls,.xlsx,.txt,.zip,.rar,.7z" style="display:none;" onchange="handleQuickReplyFileUpload(event, 'file')">
                </div>
                <div id="quickReplyFilePreview" style="margin-top:8px;display:none;">
                    <img id="quickReplyImagePreview" src="" style="max-width:200px;max-height:150px;display:none;">
                    <span id="quickReplyFileName"></span>
                    <button onclick="clearQuickReplyFile()" style="margin-left:8px;">清除</button>
                </div>
            </div>
            <div class="modal-buttons">
                <button class="cancel" onclick="closeQuickRepliesModal()">关闭</button>
                <button class="confirm" onclick="addQuickReply()">添加</button>
            </div>
        </div>
    </div>

    <div id="adminModal" class="modal-overlay" style="display:none;">
        <div class="modal" style="width:600px;">
            <h3>👑 客服管理</h3>
            <div id="adminUserList"></div>
            <div class="modal-buttons">
                <button class="cancel" onclick="closeAdminModal()">关闭</button>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal-overlay" style="display:none;">
        <div class="modal" style="width:500px;">
            <h3>编辑客服信息</h3>
            <input type="text" id="editUserId" style="display:none;">
            <div style="margin-top:16px;">
                <div style="display:flex;gap:12px;align-items:center;margin-bottom:16px;">
                    <img id="editAvatarPreview" src="" style="width:80px;height:80px;border-radius:50%;background:#eee;">
                    <div>
                        <button onclick="document.getElementById('editAvatarInput').click()" style="padding:8px 16px;background:#667eea;color:#fff;border:none;border-radius:4px;cursor:pointer;">选择头像</button>
                        <input type="file" id="editAvatarInput" accept="image/*" style="display:none;" onchange="handleAvatarUpload(event)">
                    </div>
                </div>
                <input type="text" id="editUsername" placeholder="用户名" style="width:100%;margin-bottom:8px;padding:8px;">
                <input type="text" id="editNickname" placeholder="昵称" style="width:100%;margin-bottom:8px;padding:8px;">
                <input type="password" id="editPassword" placeholder="新密码（留空不修改）" style="width:100%;margin-bottom:8px;padding:8px;">
            </div>
            <div class="modal-buttons">
                <button class="cancel" onclick="closeEditModal()">取消</button>
                <button class="confirm" onclick="saveUser()">保存修改</button>
            </div>
        </div>
    </div>

    <div id="searchResults" class="search-results" style="display:none;">
        <div class="search-results-header">
            <span>搜索结果</span>
            <span class="close" onclick="closeSearchResults()">×</span>
        </div>
        <div id="searchResultsList"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="admin.js"></script>
</body>
</html>
